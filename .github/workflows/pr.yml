name: PR

on:
  pull_request:
  merge_group:

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  check-code-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    name: 'Check Code Generation: node-24, ubuntu-latest'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install

      - name: Generate code
        id: generate
        run: |
          pnpm run generate
          pnpm run format
          pnpm run build
          pnpm run test -u
        continue-on-error: true
        env:
          CI_PREFLIGHT: true

      - name: Check diff
        id: diff
        run: |
          git add .
          git diff --cached --name-only | sed -E 's/^(.*)$/::error file=\1,line=1,title=Diff detected::Please run `pnpm run preflight` and commit the changes./'
          git diff --cached --name-only --exit-code
        continue-on-error: true

      - name: Status
        if: ${{ steps.generate.outcome == 'failure' || steps.diff.outcome == 'failure' }}
        run: exit 1
